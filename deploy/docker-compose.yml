services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: serieapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD saknas i .env}
      POSTGRES_DB: serieapp
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE saknas i .env, t.ex. ghcr.io/username/repo/backend:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://serieapp:${POSTGRES_PASSWORD}@db:5432/serieapp
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET saknas i .env}
      NODE_ENV: production
    depends_on:
      - db

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN saknas i .env}
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
